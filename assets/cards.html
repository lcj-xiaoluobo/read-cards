<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title>
<style>
:root{color-scheme:light;--ink:#292820;--muted:#827b70;--paper:#f2f3fa;--line:#e5dfd4;--accent:#8562ce;--s:#87709e;--q:#527e9e;--r:#56866c;--recite:#b68244;--review:#ab738c}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:linear-gradient(135deg,#dce7ff,#fff2df 50%,#eedcf1);background-attachment:fixed;color:var(--ink);font:15px/1.65 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:42px 28px}.eyebrow{color:var(--accent);font-size:12px;letter-spacing:2.8px}h1{font-size:clamp(25px,4vw,38px);line-height:1.35;margin:13px 0}#coverage{color:var(--muted);font-size:14px;max-width:860px;white-space:pre-wrap}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:26px 0 15px}button,input,select,textarea{font:inherit;color:inherit}button,input,select{border:1px solid var(--line);background:#fffdfa;border-radius:999px;padding:9px 15px}button{cursor:pointer}button:hover{border-color:var(--accent)}input{flex:1;min-width:210px;border-radius:14px}:focus-visible{outline:3px solid #b49acc;outline-offset:3px}#count{font-size:13px;color:var(--muted)}#wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:19px;margin-top:25px;align-items:start}.tile{display:block;min-height:154px;border:1px solid #ded7ce;border-left:5px solid var(--accent);padding:23px 24px;background:#ffffff;text-align:left;border-radius:22px;cursor:pointer;box-shadow:0 3px 10px #644c1e04}.tile:hover{transform:translateY(-2px);box-shadow:0 7px 20px #644c1e0b}.tile-meta{display:flex;justify-content:space-between;gap:10px;color:var(--accent);font-size:12px;font-weight:650}.tile h2{font:700 22px/1.4 system-ui;margin:12px 0 7px}.tile p{font-size:14px;color:var(--muted);margin:0}.tile-state{font-weight:400;font-size:11px}.quiet{font-size:12px;color:var(--muted);margin-top:25px}

/* Reference-inspired outer panel; retain the four left-label/right-copy reading rows. */
.sheet{container-type:inline-size;display:flex;flex-direction:column;width:100%;aspect-ratio:3/4;flex-shrink:0;position:relative;background-image:url("__BACKGROUND__");background-size:100% 100%;color:#292820;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei",sans-serif;isolation:isolate}
.sheet::before{content:"";position:absolute;inset:3.89cqw 4.44cqw 3.52cqw;border-radius:3.33cqw;background:#fff;border:1px solid #eeeef4;box-shadow:0 1cqw 2.6cqw #30304d22;z-index:-1}
.head{padding:6.3cqw 7.04cqw 2cqw;flex:none;height:31.85cqw}.head-meta{display:flex;align-items:start;justify-content:space-between;gap:3cqw}.module{display:inline-block;background:#8562ce;color:#fff;padding:1.1cqw 2cqw;border-radius:1.67cqw;font-size:2.78cqw;font-weight:500}.book-label{text-align:right;font-size:2.5cqw;line-height:1.55;color:#827b70;white-space:pre-line}.book-number{font:2.4cqw/1.4 Georgia,"Times New Roman",serif;color:#8562ce}.head h2{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:7.04cqw;font-weight:600;line-height:1.15;margin:5cqw 0 3cqw;letter-spacing:-.15cqw;max-width:100%}.definition{font-size:2.87cqw;color:#827b70;margin:0;line-height:1.6}
.rows{flex:none;min-height:0;max-height:90.01cqw;overflow:auto;margin:0 7.04cqw;display:flex;flex-direction:column;gap:2.04cqw;scrollbar-width:thin}.row{display:grid;grid-template-columns:15.37cqw 1fr;gap:3.1cqw;padding:1.85cqw 3.15cqw 1.85cqw 1.85cqw;border-left:.56cqw solid;flex-shrink:0;border-radius:2.04cqw}.band{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.74cqw;text-align:center;line-height:1.4}.stage-zh{font-size:2.5cqw;font-weight:400}.stage-en{font:2.59cqw/1.4 Georgia,"Times New Roman",serif}.stage-icon{display:block;width:2.96cqw;height:2.96cqw}.stage-icon svg,.footer-icon svg{display:block;width:100%;height:100%}.copy{align-self:center;font-size:3.24cqw;line-height:1.46;white-space:pre-wrap;overflow-wrap:anywhere;text-wrap:pretty}.q{min-height:17.04cqw;border-color:#527e9e;background:linear-gradient(90deg,#e7eff6,#f5f8fc)}.q .band{color:#527e9e}.r{min-height:35.56cqw;border-color:#56866c;background:linear-gradient(90deg,#e7f1e9,#f4f9f5)}.r .band{color:#56866c}.recite{min-height:19.07cqw;border-color:#b68244;background:linear-gradient(90deg,#faf0e1,#fdf8ef)}.recite .band{color:#b68244}.review{min-height:12.22cqw;border-color:#ab738c;background:linear-gradient(90deg,#f7eaf0,#fcf5f8)}.review .band{color:#ab738c}.english{font-family:Georgia,"Times New Roman",serif;font-size:3.15cqw;font-style:normal;line-height:1.38;white-space:normal}.translation{font-size:2.87cqw;line-height:1.45;margin-top:1.3cqw;color:#4f6757;white-space:normal;text-wrap:pretty}.source-kind{font-size:2.03cqw;color:#728172;margin-bottom:1.1cqw}.location{font-size:2.03cqw;color:#728172;margin-top:1.1cqw;white-space:normal}.review-copy{width:100%;min-height:5cqw}.review textarea{display:block;width:100%;min-height:5cqw;resize:vertical;background:transparent;border:0;padding:0;font-size:3.24cqw;line-height:1.46}.foot{flex:none;display:flex;gap:1.48cqw;align-items:center;min-height:7.22cqw;padding:1.3cqw 7.22cqw .5cqw;color:#827b70;font-size:1.85cqw;line-height:1.5}.author-portrait,.footer-icon{width:5.93cqw;height:5.93cqw;border-radius:50%;flex:none;object-fit:cover}.footer-icon{color:#8562ce;background:#efe8fb;padding:1.3cqw}.overview-icon{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:7px;color:#8562ce}.overview-icon svg{width:100%;height:100%}
.concealed .r .copy,.concealed .recite .copy{visibility:hidden}#survey-overview{margin:18px 0;background:#ffffff66;padding:14px 20px;border-radius:16px;color:#827b70}#survey-overview summary{cursor:pointer;font-weight:500}#survey-overview p{margin:10px 0;font-size:14px}

dialog{border:1px solid var(--line);border-radius:23px;padding:18px;max-height:96vh;overflow:auto;max-width:96vw;background:var(--paper);color:var(--ink)}dialog::backdrop{background:#312b2599;backdrop-filter:blur(5px)}.dialogbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px;align-items:center;font-size:12px}.dialogbar button{padding:5px 12px}.dialogbody .sheet{width:min(82vw,600px);margin:auto}.studytools{display:flex;gap:8px;flex-wrap:wrap;max-width:600px;margin:15px auto}.studytools button{padding:7px 12px;font-size:12px}.answerpanel{max-width:600px;margin:13px auto;font-size:14px;background:#fffdf8;padding:18px;border-radius:15px}.answerpanel h3{margin:0 0 8px;font-size:15px}.answerpanel p{white-space:pre-wrap}.answerpanel ul{padding-left:20px}#evidence{font-size:12px;max-width:600px;margin:15px auto 0}#evidence summary{cursor:pointer;color:var(--accent)}#evidence-body{max-height:30vh;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere}#save-status{font-size:11px;color:var(--muted);max-width:600px;margin:10px auto 0}#exporter{width:min(88vw,700px)}#export-text{width:100%;height:45vh;display:block;font:12px/1.5 monospace;margin:12px 0}#notice{color:#9d4f30;font-size:12px;white-space:pre-wrap}#restore-file{display:none}#poster{display:none}.poster-view main,.poster-view dialog{display:none!important}.poster-view #poster{display:block;width:min(100vw,75vh);margin:0 auto}.poster-view{background:#fcf9f2}.poster-view .sheet{border:0;border-radius:0;box-shadow:none}.poster-view .rows{overflow:auto}.poster-view .review-copy{white-space:pre-wrap}.sheet.expanded{aspect-ratio:auto;min-height:var(--minimum-card-height);overflow:visible}.sheet.expanded .head{height:auto;padding-bottom:3cqw}.sheet.expanded .rows{max-height:none;overflow:visible}.sheet.expanded .foot{padding-bottom:4.4cqw}.layout-status{font-size:12px;color:var(--muted);max-width:600px;margin:8px auto}.poster-view .layout-status{padding:0 15px}.poster-view #poster{overflow:visible}
@media(max-width:600px){main{padding:26px 18px}.toolbar{gap:8px}.tile{min-height:142px}.dialogbody .sheet{width:88vw}dialog{padding:11px}.dialogbar{margin-bottom:10px}}
@media print{body{background:#fff}main{display:none}.toolbar,#count,.quiet,dialog,#notice,.layout-status{display:none!important}#wall{display:block}.tile{display:none}#poster{display:block;width:180mm;margin:auto}.sheet{border:0;box-shadow:none;border-radius:0;break-inside:avoid}.sheet.expanded{min-height:0}.rows{overflow:visible}.concealed .r .copy,.concealed .recite .copy{visibility:visible}}
</style></head><body><main><div class="eyebrow">READ CARDS</div><h1 id="title"></h1><p id="coverage"></p><details id="survey-overview"><summary>概览 · Survey</summary><div id="survey-body"></div></details><div class="toolbar"><input id="search" type="search" aria-label="关键词搜索" placeholder="搜索概念、问题、引文或来源…"><select id="module" aria-label="按模块筛选"><option value="">全部模块</option></select><button id="restore">恢复复习记录</button><input id="restore-file" type="file" accept=".json,application/json"><button id="export">导出 JSON</button><button id="print">打印单卡 / 存为 PDF</button></div><div id="count" role="status" aria-live="polite"></div><div id="notice" role="status" aria-live="polite"></div><section id="wall" aria-label="SQ3R 卡片墙"></section><p class="quiet">参考答案与适用边界可在单卡外展开查看。复习记录需导出 JSON 保存；重新打开时可恢复同一套卡片的记录。概览放在网页导览；单卡呈现提问、精读、复述与复习。打印当前单卡前请检查文字是否完整。</p></main>
<dialog id="viewer" aria-label="单张知识卡片"><div class="dialogbar"><span id="viewer-label"></span><button id="close" aria-label="关闭单卡">关闭 ×</button></div><div id="dialogbody" class="dialogbody"></div><p id="layout-status" class="layout-status" role="status" hidden></p><div class="studytools"><button id="reveal-answer">查看参考答案</button></div><section id="answer-panel" class="answerpanel" hidden><h3>参考答案</h3><p id="answer"></p><ul id="points"></ul></section><details id="evidence"><summary>来源、适用边界与验证依据</summary><div id="evidence-body"></div></details><p id="save-status"></p></dialog>
<dialog id="exporter" aria-label="保存卡片数据"><h3>保存卡片数据</h3><p>下载文件，或全选复制下方数据并保存为 .json 文件。保存后的数据包含全部卡片和复习备注。</p><textarea id="export-text" aria-label="可复制的 JSON 数据" readonly></textarea><button id="download">下载 JSON 文件</button> <button id="export-close">关闭</button></dialog>
<div id="poster" aria-label="纯净单卡预览"></div><p id="poster-status" class="layout-status" role="status" hidden></p>
<script id="dataset" type="application/json">__DATA__</script><script>
'use strict';const iconAssets=__ICONS__, portraitURI=__PORTRAIT__, englishIds=new Set(__ENGLISH_IDS__);const data=JSON.parse(document.getElementById('dataset').textContent),sources=new Map(data.sources.map(s=>[s.id,s])), $=id=>document.getElementById(id);let opener=null,currentCard=null,practice=false;const stateNames={new:"未自评","needs-review":"需巩固",mastered:"已掌握"};
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function icon(name,cls){const el=node('span',undefined,cls);el.innerHTML=iconAssets[name];return el;}
$('survey-overview').querySelector('summary').prepend(icon('survey','overview-icon'));
function lines(text){return text.replace(/([。？！!?；;][”’」』]?)\s*/g,'$1\n').trim();}
$('title').textContent=data.title;$('coverage').textContent=data.coverage;for(const c of data.cards){if(c.survey)$('survey-body').append(node('p',c.title+'｜'+c.survey));}if(!$('survey-body').childNodes.length)$('survey-overview').hidden=true;
function build(c,editing=false){
 const sheet=node('article',undefined,'sheet'),head=node('div',undefined,'head'),meta=node('div',undefined,'head-meta');
 const index=data.cards.findIndex(x=>x.id===c.id)+1,book=data.book_title||data.title;
 const bookLabel=node('div',undefined,'book-label');bookLabel.append(node('div',book),node('div','N'+String(index).padStart(2,'0'),'book-number'));meta.append(node('div',c.module,'module'),bookLabel);
 head.append(meta,node('h2',c.title),node('p',c.definition,'definition'));sheet.classList.toggle('concealed',practice);sheet.append(head);
 const rows=node('div',undefined,'rows');
 const items=[['q','Question','提问',c.question],['r','Read','精读',c.original],['recite','Recite','复述',c.reconstruction],['review','Review','复习',c.review]];
 for(const [cls,en,zh,text] of items){
  const row=node('section',undefined,'row '+cls),band=node('div',undefined,'band');band.append(icon(en.toLowerCase(),'stage-icon'),node('span',en,'stage-en'),node('span',zh,'stage-zh'));row.append(band);
  const copy=node('div',undefined,'copy'+(cls==='review'?' review-copy':''));
  if(cls==='review'&&editing){const input=node('textarea');input.value=c.review;input.setAttribute('aria-label','填写复习备注');input.addEventListener('input',()=>{c.review=input.value;$('save-status').textContent='备注已更新到当前页面；请导出 JSON 保存。';refreshPreview(c);});copy.append(input);}
  else if(cls==='r'){
   if(c.original_kind!=='逐字引用')copy.append(node('div','原文转述','source-kind'));
   copy.append(node('div',c.original_kind==='逐字引用'?'“'+text+'”':text,englishIds.has(c.id)?'english':'original-text'));
   if(c.original_translation)copy.append(node('div',c.original_translation,'translation'));
   const locations=[...new Set(c.sources.filter(r=>!r.supports||r.supports.includes('original')).map(r=>r.location))];copy.append(node('div',locations.join('；'),'location'));
  }else copy.textContent=text;
  row.append(copy);rows.append(row);
 }
 sheet.append(rows);const foot=node('div',undefined,'foot'),emblem=c.presentation?.icon||'book';
 if(data.author_badge&&portraitURI){const img=node('img',undefined,'author-portrait');img.src=portraitURI;img.alt=data.author_badge.name+'（'+data.author_badge.role+'）';foot.append(img,node('span',data.author_badge.name+' · '+data.author_badge.role+' · '+c.id));}
 else{if(emblem!=='none')foot.append(icon(emblem,'footer-icon'));foot.append(node('span','《'+book+'》 · '+c.module+' · '+c.id));}
 sheet.append(foot);return sheet;
}

async function ensureReadable(sheet,status){
 await document.fonts.ready;
 await new Promise(resolve=>requestAnimationFrame(resolve));
 if(!sheet.isConnected||!sheet.clientWidth)return;
 const rows=sheet.querySelector('.rows'),head=sheet.querySelector('.head'),foot=sheet.querySelector('.foot');
 const headBottom=head.getBoundingClientRect().bottom;
 const headOverflow=[...head.children].some(el=>el.getBoundingClientRect().bottom>headBottom+1);
 const contentOverflow=rows.scrollHeight>rows.clientHeight+1||headOverflow||foot.getBoundingClientRect().bottom>sheet.getBoundingClientRect().bottom+1;
 if(contentOverflow){sheet.style.setProperty('--minimum-card-height',(sheet.clientWidth*4/3)+'px');sheet.classList.add('expanded');}
 if(status){status.hidden=!sheet.classList.contains('expanded');status.textContent=status.hidden?'':'内容较长，已展开显示全文。';}
}

const tiles=new Map();
function refreshPreview(c){const tile=tiles.get(c.id);const meta=node('div',undefined,'tile-meta');meta.append(node('span',c.module+' · N'+String(data.cards.findIndex(x=>x.id===c.id)+1).padStart(2,'0')));tile.replaceChildren(meta,node('h2',c.title),node('p',c.definition));}

function show(c,button){opener=button;currentCard=c;$('answer-panel').hidden=true;$('reveal-answer').hidden=false;$('answer').textContent=c.answer||c.reconstruction;$('points').replaceChildren(...(c.answer_points&&c.answer_points.length?c.answer_points.map(point=>node('li',point)):[node('li','本卡未设置检查要点（旧格式数据，未重新设计题目）。')]));$('viewer-label').textContent=c.module+' · '+c.id;$('dialogbody').replaceChildren(build(c,true));$('evidence').open=false;const body=$('evidence-body');body.replaceChildren();for(const r of c.sources){const s=sources.get(r.source_id);body.append(node('p',`${r.basis} · ${s.title}\n定位：${r.location}\n出处：${s.locator}${r.supports?'\n支持字段：'+r.supports.join('、'):''}${r.support?'\n支持程度：'+r.support:''}${r.note?'\n说明：'+r.note:''}`));}body.append(node('p','适用边界：\n'+c.boundaries.map((x,i)=>(i+1)+'. '+x).join('\n')),node('p','来源范围：'+(c.source_status||'旧格式未单独记录')+'\n核对说明：'+c.validation));if(data.author_badge)body.append(node('p','头像来源：'+data.author_badge.source+'\n图片署名：'+data.author_badge.credit));if(c.application)body.append(node('p',c.application));if(c.related_ids?.length)body.append(node('p','关联卡片：'+c.related_ids.join('、')));$('save-status').textContent='复习区默认留白；填写后导出 JSON 保存。';$('viewer').showModal();ensureReadable($('dialogbody').querySelector('.sheet'),$('layout-status'));}
for(const module of [...new Set(data.cards.map(c=>c.module))]){const option=node('option',module);option.value=module;$('module').append(option);}
for(const c of data.cards){const tile=node('div',undefined,'tile');tile.setAttribute('role','button');tile.tabIndex=0;tile.setAttribute('aria-label','打开卡片：'+c.title);tiles.set(c.id,tile);refreshPreview(c);const activate=()=>show(c,tile);tile.addEventListener('click',activate);tile.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate();}});tiles.set(c.id,tile);$('wall').append(tile);}
function filter(){const term=$('search').value.trim().toLocaleLowerCase(),module=$('module').value;let count=0;for(const c of data.cards){const tile=tiles.get(c.id),search=JSON.stringify(c)+' '+c.sources.map(r=>JSON.stringify(sources.get(r.source_id))).join(' ');tile.hidden=!(search.toLocaleLowerCase().includes(term)&&(!module||c.module===module));if(!tile.hidden)count++;}$('count').textContent=`显示 ${count} / ${data.cards.length} 张卡片`+(count?'':' · 请调整搜索条件');}
$('search').addEventListener('input',filter);$('module').addEventListener('change',filter);filter();$('close').addEventListener('click',()=>$('viewer').close());$('viewer').addEventListener('close',()=>{if(opener)opener.focus();});$('viewer').addEventListener('click',e=>{if(e.target===$('viewer')){const r=$('viewer').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('viewer').close();}});
$('export').addEventListener('click',()=>{$('export-text').value=JSON.stringify(data,null,2);$('exporter').showModal();});$('export-close').addEventListener('click',()=>$('exporter').close());$('download').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=node('a');a.href=url;a.download='read-cards-data.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});$('print').addEventListener('click',async()=>{const first=data.cards.find(c=>!tiles.get(c.id).hidden);if(!first)return;practice=false;$('poster').replaceChildren(build(currentCard||first));$('poster').style.display='block';await ensureReadable($('poster').querySelector('.sheet'));window.print();$('poster').style.display='';});
$('reveal-answer').addEventListener('click',()=>{$('answer-panel').hidden=false;$('reveal-answer').hidden=true;$('dialogbody').querySelector('.sheet').classList.remove('concealed');});
$('restore').addEventListener('click',()=>$('restore-file').click());
$('restore-file').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{const imported=JSON.parse(await file.text());if(imported.title!==data.title||!Array.isArray(imported.cards)||imported.cards.length!==data.cards.length)throw new Error('该数据与当前卡片集不匹配。');const byId=new Map(imported.cards.map(c=>[c.id,c]));if(byId.size!==data.cards.length)throw new Error('导入数据有重复卡片 ID。');const pending=[];for(const c of data.cards){const found=byId.get(c.id);if(!found||['survey','question','original','original_translation','reconstruction','answer'].some(k=>(found[k]||'')!==(c[k]||'')))throw new Error('卡片内容已经改变，不能直接套用旧记录：'+c.id);if(typeof found.review!=='string'||!Object.hasOwn(stateNames,found.learning_state??'new'))throw new Error('复习记录格式无效：'+c.id);pending.push([c,found.review,found.learning_state??'new']);}for(const [c,review,state] of pending){c.review=review;c.learning_state=state;refreshPreview(c);}filter();$('notice').textContent='已恢复 '+pending.length+' 张卡片的复习记录；当前页面内容尚未自动写入磁盘。';}catch(error){$('notice').textContent='恢复失败：'+error.message;}finally{event.target.value='';}});

const cardId=new URLSearchParams(location.search).get('card');
if(cardId){const c=data.cards.find(x=>x.id===cardId);document.body.classList.add('poster-view');if(c){$('poster').replaceChildren(build(c));ensureReadable($('poster').querySelector('.sheet'),$('poster-status'));document.title=c.title+' · 书卡';}else $('poster').textContent='没有找到该卡片 ID。';}

</script></body></html>
